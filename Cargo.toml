[package]
name = "betterdeck"
version = "0.1.0"
edition = "2024"
description = "Native FIFINE AmpliGame D6 controller"

[dependencies]
anyhow = "1"
directories = "6"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
enigo = { version = "0.6", default-features = false }
hidapi = "2.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30"
sha2 = "0.10"
base64 = "0.22"
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.26.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder", "NSRunningApplication"] }

[profile.dev.package."*"]
opt-level = 2
